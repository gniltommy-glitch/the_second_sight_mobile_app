name: secondsight
description: SecondSight mobile companion for local assistive glasses.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  share_plus: ^11.1.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.3.2
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
